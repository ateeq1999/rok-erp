name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  checks:
    name: fmt, clippy, docs and tests
    runs-on: ubuntu-latest

    # The Phase 0 spikes read and write real PostgreSQL: money in a numeric
    # column, and row level security seen from the non-owner role.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The spikes skip without this, so it is set rather than left to chance.
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - name: Install the system libraries GPUI links against
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libfontconfig-dev libx11-xcb-dev libxcb1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features

      - name: docs
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings

      - name: tests
        run: cargo test --workspace --all-features

      # Phase 1 step 6: every up migration, then every down migration, then
      # the ups again, on a throwaway database. A down migration that does
      # not reverse its up one fails the build here rather than in a
      # customer's upgrade.
      - name: migration verifier
        run: cargo run -p migration-verifier