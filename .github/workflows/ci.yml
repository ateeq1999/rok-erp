name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  checks:
    name: fmt, clippy, docs and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the system libraries GPUI links against
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libfontconfig-dev libx11-xcb-dev libxcb1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Phase 0 has no queries yet. A PostgreSQL service arrives with the database phase.
      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features

      - name: docs
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings

      - name: tests
        run: cargo test --workspace --all-features